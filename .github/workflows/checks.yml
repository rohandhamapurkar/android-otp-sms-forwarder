name: Android Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint, and build variants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # No private signing key is needed: debug uses an ephemeral key here,
      # and the optimized release APK is unsigned and is never published.
      - name: Run unit tests, lint, and debug/release builds
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug :app:lintRelease \
            :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease \
            --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-check-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14
