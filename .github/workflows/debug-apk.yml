name: Release Debug APK

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # This project uses compileSdk 36, targetSdk 36, and minSdk 23.
      # AGP installs its required build-tools using the accepted SDK licenses.
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Collect APK and checksum
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sha=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/otpforwarder-debug-${sha}.apk"
          (
            cd artifacts
            sha256sum *.apk > SHA256SUMS.txt
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Inspect APK
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk="artifacts/otpforwarder-debug-${{ steps.collect.outputs.sha }}.apk"
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/aapt2" dump badging "$apk" > artifacts/apk-info.txt
          {
            echo '### OTP Forwarder debug APK'
            echo
            echo "File: $(basename "$apk")"
            echo
            echo '```text'
            grep -E 'package:|sdkVersion|targetSdkVersion|native-code' artifacts/apk-info.txt
            echo '```'
            echo
            echo 'SHA-256:'
            echo '```text'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: otpforwarder-debug-apk-${{ steps.collect.outputs.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS.txt \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
